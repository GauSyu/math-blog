name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - run: ./blog setup
      - run: ./blog check
      - run: ./blog build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: site-preview
          path: public/

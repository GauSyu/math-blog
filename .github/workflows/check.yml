name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      MATH_BLOG_REQUIRE_TEX: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - name: Install TikZ rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y texlive-latex-base texlive-latex-extra texlive-pictures dvisvgm
      - run: ./blog setup
      - run: ./blog check
      - run: ./blog build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: site-preview
          path: public/
